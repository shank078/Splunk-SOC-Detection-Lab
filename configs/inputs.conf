# =============================================================================
# Splunk Inputs Configuration — Windows Security Event Log Ingestion
# =============================================================================
# Author      : Shankar Baral
# Project     : Splunk SOC Detection Lab
# File Path   : $SPLUNK_HOME\etc\system\local\inputs.conf
# Purpose     : Configure Splunk Enterprise to ingest local Windows Security
#               event logs in real-time for SIEM detection use cases.
# -----------------------------------------------------------------------------
# Deployment  : Standalone Splunk Enterprise on Windows Server 2022 (Azure VM)
# Index       : main (default)
# Source Type : WinEventLog:Security
# =============================================================================


# -----------------------------------------------------------------------------
# [WinEventLog://Security]
# Captures all Windows Security audit events including:
#   - Event 4624: Successful Logon
#   - Event 4625: Failed Logon          <-- Brute-Force Detection
#   - Event 4634: Logoff
#   - Event 4648: Explicit Credential Logon
#   - Event 4672: Special Privileges Assigned
#   - Event 4688: Process Creation
#   - Event 4720: User Account Created
#   - Event 4740: Account Locked Out    <-- Lockout Correlation
#   - Event 4768: Kerberos TGT Requested
# -----------------------------------------------------------------------------

[WinEventLog://Security]
disabled = 0
start_from = oldest
current_only = 0
checkpointInterval = 5
index = main
sourcetype = WinEventLog:Security
renderXml = false


# -----------------------------------------------------------------------------
# [WinEventLog://System]
# Captures system-level events for host health & service monitoring.
# Useful for detecting service crashes, driver failures, and reboots that
# may indicate post-exploitation activity.
# -----------------------------------------------------------------------------

[WinEventLog://System]
disabled = 0
start_from = oldest
current_only = 1
index = main
sourcetype = WinEventLog:System


# -----------------------------------------------------------------------------
# [WinEventLog://Application]
# Captures application-layer events. Useful for tracking unexpected app
# crashes or anomalous service behavior post-compromise.
# -----------------------------------------------------------------------------

[WinEventLog://Application]
disabled = 0
start_from = oldest
current_only = 1
index = main
sourcetype = WinEventLog:Application


# =============================================================================
# Notes:
#   - "current_only = 0" on Security log = ingest historical + new events
#     (used during initial setup to backfill attack data)
#   - For production, set "current_only = 1" to ingest only new events
#   - "checkpointInterval = 5" = flush every 5 seconds (near real-time)
# =============================================================================